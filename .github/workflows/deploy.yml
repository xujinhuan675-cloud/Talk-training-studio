name: Deploy TalkWise

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified images to production
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: talkwise-production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/xujinhuan675-cloud

jobs:
  build-push:
    name: Build and push TalkWise images
    runs-on: ubuntu-latest
    outputs:
      prefetch_id: ${{ steps.vars.outputs.prefetch_id }}
      backend_image: ${{ steps.vars.outputs.backend_image }}
      newapi_image: ${{ steps.vars.outputs.newapi_image }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      newapi_digest: ${{ steps.newapi.outputs.digest }}
      root_commit: ${{ steps.vars.outputs.root_commit }}
      newapi_commit: ${{ steps.vars.outputs.newapi_commit }}
    steps:
      - name: Check out TalkWise
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify deployment behavior
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml shellcheck
          python3 -m unittest discover -s scripts/tests -v
          shellcheck -x -P scripts scripts/*.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image refs
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          root_commit="$(git rev-parse HEAD)"
          newapi_commit="$(git -C outside-project/new-api-main rev-parse HEAD)"
          backend_image="${IMAGE_NAMESPACE}/talkwise-backend:prod-${root_commit}"
          newapi_image="${IMAGE_NAMESPACE}/talkwise-frontend-host:prod-${root_commit}-${newapi_commit}"
          echo "prefetch_id=talkwise-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${root_commit:0:12}" >> "$GITHUB_OUTPUT"
          echo "root_commit=${root_commit}" >> "$GITHUB_OUTPUT"
          echo "newapi_commit=${newapi_commit}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${backend_image}" >> "$GITHUB_OUTPUT"
          echo "newapi_image=${newapi_image}" >> "$GITHUB_OUTPUT"
          echo "Building backend ${backend_image}"
          echo "Building frontend host ${newapi_image}"

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.deploy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.backend_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.root_commit }}
            org.opencontainers.image.title=TalkWise backend
            org.opencontainers.image.version=${{ steps.vars.outputs.root_commit }}
          cache-from: type=gha,scope=talkwise-backend
          cache-to: type=gha,mode=max,scope=talkwise-backend
          provenance: mode=max
          sbom: true

      - name: Build and push TalkWise frontend host image
        id: newapi
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./outside-project/new-api-main
          file: ./outside-project/new-api-main/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.newapi_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.root_commit }}
            org.opencontainers.image.title=TalkWise frontend host
            org.opencontainers.image.version=${{ steps.vars.outputs.newapi_commit }}
          cache-from: type=gha,scope=talkwise-newapi
          cache-to: type=gha,mode=max,scope=talkwise-newapi
          provenance: mode=max
          sbom: true

  prefetch:
    name: Download directly on server and prefetch images
    permissions:
      contents: read
      packages: read
    needs: build-push
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Server-direct segmented OCI download and local prefetch
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE_REF: ${{ needs.build-push.outputs.backend_image }}
          NEWAPI_IMAGE_REF: ${{ needs.build-push.outputs.newapi_image }}
          BACKEND_DIGEST: ${{ needs.build-push.outputs.backend_digest }}
          NEWAPI_DIGEST: ${{ needs.build-push.outputs.newapi_digest }}
          ROOT_COMMIT: ${{ needs.build-push.outputs.root_commit }}
          NEWAPI_COMMIT: ${{ needs.build-push.outputs.newapi_commit }}
          PREFETCH_ID: ${{ needs.build-push.outputs.prefetch_id }}
        run: bash scripts/runner-release.sh prefetch

  deploy:
    name: Switch verified local production images
    needs: [build-push, prefetch]
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Switch without registry access and verify actual image IDs
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          BACKEND_IMAGE_REF: ${{ needs.build-push.outputs.backend_image }}
          NEWAPI_IMAGE_REF: ${{ needs.build-push.outputs.newapi_image }}
          BACKEND_DIGEST: ${{ needs.build-push.outputs.backend_digest }}
          NEWAPI_DIGEST: ${{ needs.build-push.outputs.newapi_digest }}
          ROOT_COMMIT: ${{ needs.build-push.outputs.root_commit }}
          NEWAPI_COMMIT: ${{ needs.build-push.outputs.newapi_commit }}
          PREFETCH_ID: ${{ needs.build-push.outputs.prefetch_id }}
        run: bash scripts/runner-release.sh switch
