services:
  postgres:
    image: postgres:15-alpine
    container_name: stakecoach_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stakecoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stakecoachdb}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stakecoach} -d ${POSTGRES_DB:-stakecoachdb}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: ./backend
    container_name: stakecoach_api
    ports:
      - "8000:8000"
    environment:
      DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-stakecoach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stakecoachdb}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-false}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-https://newapi.flowguide.cc}
      NEWAPI_ACCESS_TOKEN: ${NEWAPI_ACCESS_TOKEN:-}
      NEWAPI_GATEWAY_BASE_URL: ${NEWAPI_GATEWAY_BASE_URL:-https://newapi.flowguide.cc/v1}
      NEWAPI_USER_BILLING_ENABLED: ${NEWAPI_USER_BILLING_ENABLED:-false}
      NEWAPI_USER_RELAY_BASE_URL: ${NEWAPI_USER_RELAY_BASE_URL:-}
      NEWAPI_USER_RELAY_REALTIME_URL: ${NEWAPI_USER_RELAY_REALTIME_URL:-}
      NEWAPI_AUTH_ENABLED: ${NEWAPI_AUTH_ENABLED:-false}
      NEWAPI_AUTH_ALLOW_MOCK_FALLBACK: ${NEWAPI_AUTH_ALLOW_MOCK_FALLBACK:-false}
      NEWAPI_AUTH_TIMEOUT_SECONDS: ${NEWAPI_AUTH_TIMEOUT_SECONDS:-5}
      NEWAPI_TALKWISE_CLIENT_ID: ${NEWAPI_TALKWISE_CLIENT_ID:-talkwise}
      NEWAPI_TALKWISE_CLIENT_SECRET: ${NEWAPI_TALKWISE_CLIENT_SECRET:-}
      NEWAPI_TALKWISE_AUTH_EXCHANGE_PATH: ${NEWAPI_TALKWISE_AUTH_EXCHANGE_PATH:-/api/talkwise/auth/exchange}
      NEWAPI_TALKWISE_REDIRECT_URI: ${NEWAPI_TALKWISE_REDIRECT_URI:-}
      TALKWISE_SESSION_COOKIE_NAME: ${TALKWISE_SESSION_COOKIE_NAME:-talkwise_session}
      TALKWISE_SESSION_TTL_SECONDS: ${TALKWISE_SESSION_TTL_SECONDS:-28800}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://newapi.flowguide.cc/v1}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-gpt-4o-mini}
      OPENAI_COMPATIBLE_WIRE_API: ${OPENAI_COMPATIBLE_WIRE_API:-chat_completions}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  grpc:
    build: ./backend
    container_name: stakecoach_grpc
    ports:
      - "50051:50051"
    environment:
      DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-stakecoach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stakecoachdb}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-false}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-https://newapi.flowguide.cc}
      NEWAPI_ACCESS_TOKEN: ${NEWAPI_ACCESS_TOKEN:-}
      NEWAPI_GATEWAY_BASE_URL: ${NEWAPI_GATEWAY_BASE_URL:-https://newapi.flowguide.cc/v1}
      NEWAPI_USER_BILLING_ENABLED: ${NEWAPI_USER_BILLING_ENABLED:-false}
      NEWAPI_USER_RELAY_BASE_URL: ${NEWAPI_USER_RELAY_BASE_URL:-}
      NEWAPI_USER_RELAY_REALTIME_URL: ${NEWAPI_USER_RELAY_REALTIME_URL:-}
      NEWAPI_AUTH_ENABLED: ${NEWAPI_AUTH_ENABLED:-false}
      NEWAPI_AUTH_ALLOW_MOCK_FALLBACK: ${NEWAPI_AUTH_ALLOW_MOCK_FALLBACK:-false}
      NEWAPI_AUTH_TIMEOUT_SECONDS: ${NEWAPI_AUTH_TIMEOUT_SECONDS:-5}
      NEWAPI_TALKWISE_CLIENT_ID: ${NEWAPI_TALKWISE_CLIENT_ID:-talkwise}
      NEWAPI_TALKWISE_CLIENT_SECRET: ${NEWAPI_TALKWISE_CLIENT_SECRET:-}
      NEWAPI_TALKWISE_AUTH_EXCHANGE_PATH: ${NEWAPI_TALKWISE_AUTH_EXCHANGE_PATH:-/api/talkwise/auth/exchange}
      NEWAPI_TALKWISE_REDIRECT_URI: ${NEWAPI_TALKWISE_REDIRECT_URI:-}
      TALKWISE_SESSION_COOKIE_NAME: ${TALKWISE_SESSION_COOKIE_NAME:-talkwise_session}
      TALKWISE_SESSION_TTL_SECONDS: ${TALKWISE_SESSION_TTL_SECONDS:-28800}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://newapi.flowguide.cc/v1}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-gpt-4o-mini}
      OPENAI_COMPATIBLE_WIRE_API: ${OPENAI_COMPATIBLE_WIRE_API:-chat_completions}
      GRPC__ENABLED: "true"
      GRPC__HOST: 0.0.0.0
      GRPC__PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backend:/app
    command: bash -c "bash scripts/gen_protos.sh && python grpc_main.py"

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
